name: leakguard
description: LeakGuard — smart water leak monitoring client for the Arduino Uno + HM-10 rig.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # BLE transport to the HM-10 (transparent serial over GATT FFE0/FFE1).
  flutter_blue_plus: 2.3.13
  permission_handler: 13.0.2

  # Local time-series database for readings, rollups and the event log.
  sqflite: 2.4.4
  path: 1.9.1
  path_provider: 2.1.6

  # Settings persistence. Pinned to 2.3.2: the 2.5.x line ships a coroutine-based
  # getAll() in shared_preferences_android that crashed the release build at
  # startup (NoSuchMethodError: getAll -> white screen) under this AGP/Flutter
  # toolchain. 2.3.2 predates that API and is stable here.
  shared_preferences: 2.3.2

  # State management.
  provider: 6.1.5+1

  # Typography from DESIGN.md (Inter + JetBrains Mono).
  google_fonts: 9.0.0

  # Date/number formatting.
  intl: 0.20.3

# Force the Android implementation of shared_preferences to a pre-coroutine
# release. Left to float it resolves to 2.5.0, whose coroutine-based getAll()
# is not present at runtime under this toolchain and crashes the release app
# on startup (NoSuchMethodError: getAll -> white screen).
dependency_overrides:
  shared_preferences_android: 2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Property-based testing generators and shrinking (task 1.3 decision point).
  glados: 1.1.7

flutter:
  uses-material-design: true

name: Build Android APK

# Builds the LeakGuard Flutter app on GitHub's servers and publishes the APK
# as a downloadable artifact. Lets you get the app onto a phone without a local
# Android build (no NDK/Gradle downloads or disk usage on your own machine).
#
# Trigger it manually from the repo's Actions tab ("Run workflow"), or it runs
# automatically on a push to master that touches the Flutter app.

on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - "flutter_app/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Regenerate the Android host project first. The repo intentionally does
      # not commit flutter_app/android (it is generated), so recreate it here.
      # Do this BEFORE pub get so it cannot overwrite the committed lockfile.
      - name: Ensure Android platform
        run: flutter create . --platforms=android --project-name leakguard

      # `flutter create` above runs its own pub get and REWRITES pubspec.lock
      # with floated versions. Restore our committed lock so the build uses the
      # exact plugin versions verified locally. Without this, the runner floated
      # shared_preferences_android to a newer native version than the Dart side
      # expected, crashing the release app at startup
      # (NoSuchMethodError: getAll -> white screen).
      - name: Restore committed lockfile
        run: git checkout -- pubspec.lock

      # `flutter create` generates a default AndroidManifest with NO Bluetooth
      # permissions, so BLE scan/connect fails instantly ("could not connect").
      # Inject the permissions from PLATFORM_SETUP.md right after the <manifest>
      # tag. The android/ dir is regenerated each build, so this must run in CI.
      - name: Inject Bluetooth permissions into AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" <<'PY'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding="utf-8") as f:
              xml = f.read()
          perms = '''
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />
          '''
          if "BLUETOOTH_SCAN" not in xml:
              xml = re.sub(r"(<manifest\b[^>]*>)", r"\1" + perms, xml, count=1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(xml)
              print("Injected Bluetooth permissions.")
          else:
              print("Permissions already present.")
          print("--- permission lines ---")
          for line in xml.splitlines():
              if "uses-permission" in line or "uses-feature" in line:
                  print(line.strip())
          PY

      - name: Fetch dependencies (locked)
        run: flutter pub get --enforce-lockfile

      # The permission_handler plugin requires compileSdk 37, but the generated
      # project defaults lower. Pin compileSdk (and keep NDK) so the AAR metadata
      # check passes. The android/ dir is regenerated above, so patch it here.
      - name: Pin compileSdk to 37
        run: |
          GRADLE=android/app/build.gradle.kts
          echo "--- before ---"
          grep -n "compileSdk" "$GRADLE" || true
          # Replace whatever compileSdk is set to (flutter.compileSdkVersion or a literal) with 37.
          sed -i -E 's/compileSdk(Version)?\s*=\s*.*/compileSdk = 37/' "$GRADLE"
          echo "--- after ---"
          grep -n "compileSdk" "$GRADLE" || true

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      # Also build a universal APK as a fallback that installs on any device.
      - name: Build universal release APK
        run: flutter build apk --release

      # Profile build: keeps Dart assertions and prints full stack traces to
      # logcat (tag "flutter"), unlike release which strips them. Used to
      # diagnose runtime crashes we cannot see in a release build.
      - name: Build profile APK (arm64, for crash diagnosis)
        run: flutter build apk --profile --target-platform android-arm64

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: leakguard-apks
          path: flutter_app/build/app/outputs/flutter-apk/*release*.apk
          if-no-files-found: error

      - name: Upload profile APK
        uses: actions/upload-artifact@v4
        with:
          name: leakguard-profile
          path: flutter_app/build/app/outputs/flutter-apk/*profile*.apk
          if-no-files-found: error
